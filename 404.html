<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Pagina non trovata · Professor Hub</title>
<!-- GitHub Pages mostra questa pagina per QUALSIASI indirizzo sbagliato
     sotto /badge/: per questo tutti i percorsi sono assoluti (/badge/…).
     È autonoma (stili qui dentro) così funziona a qualunque profondità. -->
<link rel="icon" href="/badge/assets/images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Colori e caratteri dalla pagina (css/variables.css, css/dark-mode.css) */
:root{color-scheme:light dark;--bg:#f7f5ff;--surface2:#fffdfd;--ink:#30286b;--muted:#756d91;--line:#dfd4f5;--accent:#8d68df;--shadow:0 18px 48px rgba(100,75,160,.12);--font-body:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--font-display:"Baloo 2",Inter,ui-rounded,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--font-body);background:radial-gradient(700px 420px at 5% 0%,#eadcff 0,transparent 70%),radial-gradient(700px 420px at 100% 18%,#f9ddf0 0,transparent 70%),radial-gradient(rgba(141,104,223,.14) 1px,transparent 1.4px) 0 0/24px 24px,radial-gradient(rgba(210,123,197,.16) 1.4px,transparent 1.6px) 12px 12px/48px 48px,var(--bg);display:grid;place-items:center;padding:24px}
.box{position:relative;max-width:420px;width:100%;padding:34px 30px 30px;border:1px solid #d8c8fa;border-radius:22px;background:var(--surface2);box-shadow:var(--shadow);text-align:center}
.mark{width:52px;height:52px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#ee9fda,#8b6be7);color:#fff}
.codice{margin:0 0 4px;font-size:11px;font-weight:700;letter-spacing:.14em;color:#6b4bc6}
h1{margin:0;font-size:26px;font-family:var(--font-display);font-weight:700;color:var(--ink)}
p{margin:12px 0 0;color:var(--muted);font-size:14px;line-height:1.65}
.bottone{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;margin-top:22px;padding:0 22px;border-radius:99px;background:linear-gradient(135deg,#7a4fd3,#a4489a);color:#fff;font-weight:700;font-size:14px;text-decoration:none;box-shadow:0 10px 24px rgba(141,104,223,.28)}
.bottone:focus-visible{outline:3px solid #b99cf4;outline-offset:3px}
.lingua{position:absolute;top:14px;right:14px;min-width:34px;height:26px;padding:0 9px;border:1px solid var(--line);border-radius:99px;background:var(--surface2);color:#7650c9;font:800 10px var(--font-body);letter-spacing:.5px;cursor:pointer}
.stelle{position:absolute;color:#d9a3e8;font-size:16px}
.s1{top:18px;left:22px}.s2{bottom:20px;right:26px;font-size:12px}
@media(prefers-color-scheme:dark){
:root{--bg:#171426;--surface2:#211b32;--ink:#f2edff;--muted:#c2b8da;--line:#45395f;--accent:#b99cf4;--shadow:0 22px 55px rgba(0,0,0,.35)}
body{background:radial-gradient(700px 420px at 5% 0%,#302349 0,transparent 70%),radial-gradient(700px 420px at 100% 18%,#3a263b 0,transparent 70%),var(--bg)}
.box{border-color:#4b3d67}
.lingua{color:#c4a6f7}
.codice{color:var(--accent)}
.stelle{color:#8d6fb8}
}
</style>
</head>
<body>
<main class="box">
  <span class="stelle s1" aria-hidden="true">✦</span><span class="stelle s2" aria-hidden="true">✧</span>
  <button class="lingua" id="lingua" type="button"></button>
  <div class="mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8 18.6 5.2v5.6c0 3.9-2.7 6.9-6.6 8.6-3.9-1.7-6.6-4.7-6.6-8.6V5.2Z"/><circle cx="12" cy="10.4" r="2.1"/></svg></div>
  <p class="codice">404</p>
  <h1 id="titolo">Pagina non trovata</h1>
  <p id="testo">L'indirizzo che hai aperto non esiste: forse c'è un errore di battitura. La pagina del Professore è qui.</p>
  <a class="bottone" id="bottone" href="/badge/">Vai alla pagina del Professore</a>
</main>
<script>
  // Stessa lingua della pagina principale: la scelta salvata, se c'è,
  // altrimenti quella del dispositivo (italiano, oppure inglese per tutto il resto).
  var TESTI = {
    it: { titolo: "Pagina non trovata", testo: "L'indirizzo che hai aperto non esiste: forse c'è un errore di battitura. La pagina del Professore è qui.", bottone: "Vai alla pagina del Professore", lingua: "EN", etichetta: "Read in English", pagina: "Pagina non trovata · Professor Hub" },
    en: { titolo: "Page not found", testo: "The address you opened doesn't exist: there may be a typo. The Professor's page is here.", bottone: "Go to the Professor's page", lingua: "IT", etichetta: "Leggi in italiano", pagina: "Page not found · Professor Hub" }
  };
  var CHIAVE = "professorhub:lingua";
  function linguaIniziale() {
    try { var s = localStorage.getItem(CHIAVE); if (s === "it" || s === "en") return s; } catch (e) {}
    var elenco = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "it"];
    for (var i = 0; i < elenco.length; i++) {
      var base = String(elenco[i]).toLowerCase().split("-")[0];
      if (base === "it" || base === "en") return base;
    }
    return "en";
  }
  function mostra(l) {
    var t = TESTI[l];
    document.documentElement.lang = l;
    document.title = t.pagina;
    document.getElementById("titolo").textContent = t.titolo;
    document.getElementById("testo").textContent = t.testo;
    document.getElementById("bottone").textContent = t.bottone;
    var b = document.getElementById("lingua");
    b.textContent = t.lingua;
    b.setAttribute("aria-label", t.etichetta);
    b.onclick = function () {
      var nuova = l === "it" ? "en" : "it";
      try { localStorage.setItem(CHIAVE, nuova); } catch (e) {}
      mostra(nuova);
    };
  }
  mostra(linguaIniziale());
</script>
</body>
</html>
