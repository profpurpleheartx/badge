<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pokégear // Professor Profile</title>

<meta property="og:title" content="Pokégear // Professoressa Stefi" />
<meta property="og:description" content="Tesserino digitale ufficiale e certificazioni Play! Pokémon." />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://profpurpleheartx.github.io/badge/preview-card.png" />
<meta property="og:url" content="https://profpurpleheartx.github.io/badge/" />

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css" />
<style>
  :root {
    --bg-app: #121216;
    --chassis: #22212b;
    --chassis-border: #424053;
    --screen-bg: #16151c;
    --screen-border: #2e2d3b;
    --primary: #8A7FD1;
    --accent-silver: #d1d0e0;
    --text-main: #f4f2fa;
    --text-muted: #9e9cb8;
    --success: #34d399;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  body {
    background-color: var(--bg-app);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
  }

  .pokegear-chassis {
    background: var(--chassis);
    border: 3px solid var(--chassis-border);
    border-radius: 32px;
    width: 100%;
    max-width: 440px;
    padding: 24px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    position: relative;
  }

  .pokegear-header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding: 0 4px;
  }

  .pokegear-brand {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--accent-silver);
    text-transform: uppercase;
  }

  .pokegear-status-dot {
    width: 10px;
    height: 10px;
    background-color: var(--success);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--success);
  }

  .pokegear-screen {
    background-color: var(--screen-bg);
    border: 2px solid var(--screen-border);
    border-radius: 16px;
    padding: 18px;
    text-align: center;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
  }

  #stato-contenitore {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 380px;
  }

  .avatar-container {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    border: 3px solid var(--primary);
    overflow: hidden;
    margin: 0 auto 12px;
    background: #1c1b24;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    color: var(--primary);
  }

  .avatar-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  h1 {
    font-size: 1.3rem;
    font-weight: 700;
    margin-bottom: 2px;
    color: var(--text-main);
  }

  .ruolo-prof {
    font-size: 0.8rem;
    color: var(--primary);
    font-weight: 600;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .info-badge {
    background: rgba(138, 127, 209, 0.1);
    border: 1px solid rgba(138, 127, 209, 0.25);
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 0.75rem;
    color: var(--text-muted);
    display: inline-block;
    margin-bottom: 14px;
  }

  .info-badge span {
    color: var(--accent-silver);
    font-weight: 600;
  }

  .sezione-certificazioni {
    width: 100%;
    margin-top: 8px;
    text-align: left;
  }

  .sezione-titolo {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--screen-border);
    padding-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .vetrina-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    max-height: 150px;
    overflow-y: auto;
    padding-right: 2px;
  }

  .vetrina-grid::-webkit-scrollbar {
    width: 4px;
  }
  .vetrina-grid::-webkit-scrollbar-thumb {
    background: var(--screen-border);
    border-radius: 4px;
  }

  .cert-card {
    background: #1b1a24;
    border: 1px solid #323042;
    border-radius: 10px;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: all 0.2s ease;
  }

  .cert-card:hover {
    border-color: var(--primary);
    background: #211f2d;
  }

  .cert-icon-box {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: rgba(138, 127, 209, 0.15);
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .cert-info {
    display: flex;
    flex-direction: column;
    text-align: left;
  }

  .cert-name {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-main);
  }

  .cert-type {
    font-size: 0.68rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .social-grid {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 14px;
  }

  .social-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #1b1a24;
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    border: 1px solid #323042;
    transition: all 0.2s;
  }

  .social-btn:hover {
    background: var(--primary);
    color: #121216;
  }

  .offline-box {
    text-align: center;
    padding: 40px 20px;
  }

  .offline-box i {
    font-size: 48px;
    color: var(--text-muted);
    margin-bottom: 16px;
  }

  .offline-box p {
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  .pokegear-footer-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    padding-top: 12px;
    border-top: 1px solid var(--chassis-border);
  }

  .d-pad {
    width: 38px;
    height: 38px;
    background: #191821;
    border-radius: 50%;
    border: 2px solid #383647;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 15px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .d-pad:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: #22212b;
  }

  .d-pad:active {
    transform: scale(0.92);
  }

  .brand-tag {
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 1px;
  }
</style>
</head>
<body>

  <div class="pokegear-chassis">
    <div class="pokegear-header-bar">
      <span class="pokegear-brand"><i class="ti ti-device-mobile"></i> POKÉGEAR v3.0</span>
      <div class="pokegear-status-dot" id="indicatore-stato"></div>
    </div>

    <div class="pokegear-screen" id="schermo-lcd">
      <div id="stato-contenitore">
        <!-- Contenuto dinamico iniziale -->
      </div>
    </div>

    <div class="pokegear-footer-controls">
      <div class="d-pad" id="btn-power" title="Diagnostica Sistema"><i class="ti ti-power"></i></div>
      <span class="brand-tag">LEAGUE CONSOLE</span>
      <div class="d-pad" id="btn-pokeball" title="Messaggio Segreto"><i class="ti ti-pokeball"></i></div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      let configData = null;

      try {
        const response = await fetch('config.json');
        if (!response.ok) throw new Error("Errore nel caricamento della configurazione");
        configData = await response.json();

        if (configData.disattivato) {
          document.getElementById("indicatore-stato").style.backgroundColor = "#ef4444";
          document.getElementById("indicatore-stato").style.boxShadow = "0 0 8px #ef4444";
          document.getElementById("stato-contenitore").innerHTML = `
            <div class="offline-box">
              <i class="ti ti-eye-off"></i>
              <h1>Modalità Sospesa</h1>
              <p>Il Pokégear è temporaneamente offline. Torna a trovarci durante i prossimi eventi ufficiali!</p>
            </div>
          `;
          return;
        }

        caricaInterfaccia(configData);

      } catch (error) {
        console.error("Impossibile caricare il profilo:", error);
        document.getElementById("stato-contenitore").innerHTML = `
          <div class="offline-box">
            <i class="ti ti-alert-circle"></i>
            <h1>Errore di Caricamento</h1>
            <p>Impossibile leggere il file di configurazione del Pokégear.</p>
          </div>
        `;
      }

      function caricaInterfaccia(config) {
        // Ricostruisce sempre la struttura HTML di base prima di inserire i dati
        const contenitore = document.getElementById("stato-contenitore");
        contenitore.innerHTML = `
          <div class="avatar-container" id="profilo-avatar">
            <i class="ti ti-shield-check"></i>
          </div>
          <h1 id="profilo-nome"></h1>
          <p class="ruolo-prof"></p>
          
          <div class="info-badge">
            Player ID: <span id="profilo-pid"></span> | Area: <span id="profilo-regione"></span>
          </div>

          <div class="sezione-certificazioni">
            <p class="sezione-titolo"><i class="ti ti-certificate"></i> Vetrina Credenziali</p>
            <div class="vetrina-grid" id="profilo-vetrina"></div>
          </div>

          <div class="social-grid" id="profilo-socials"></div>
        `;

        document.getElementById("profilo-nome").textContent = config.nome;
        document.getElementById("profilo-pid").textContent = config.playerId;
        document.getElementById("profilo-regione").textContent = config.regione;
        document.querySelector(".ruolo-prof").textContent = config.ruolo;

        const avatarContainer = document.getElementById("profilo-avatar");
        if (config.avatarUrl && config.avatarUrl.trim() !== "") {
          avatarContainer.innerHTML = `
            <img src="${config.avatarUrl}" alt="Avatar ${config.nome}" 
                 onerror="this.onerror=null; this.parentNode.innerHTML='<i class=\\'ti ti-shield-check\\'></i>';" />
          `;
        }

        const vetrinaGrid = document.getElementById("profilo-vetrina");
        vetrinaGrid.innerHTML = config.certificazioni
          .map(cert => `
            <div class="cert-card">
              <div class="cert-icon-box">
                <i class="${cert.icon || 'ti ti-award'}"></i>
              </div>
              <div class="cert-info">
                <span class="cert-name">${cert.titolo}</span>
                <span class="cert-type">${cert.categoria}</span>
              </div>
            </div>
          `).join("");

        const socialGrid = document.getElementById("profilo-socials");
        socialGrid.innerHTML = config.socials
          .map(s => `<a href="${s.url}" class="social-btn" target="_blank" aria-label="${s.platform}"><i class="ti ti-${s.platform}"></i></a>`)
          .join("");
      }

      // --- EASTER EGG D-PAD ---
      const btnPower = document.getElementById("btn-power");
      const btnPokeball = document.getElementById("btn-pokeball");
      const schermoLcd = document.getElementById("schermo-lcd");
      let inModalitaDiagnostica = false;

      btnPower.addEventListener("click", () => {
        if (!configData || configData.disattivato) return;
        inModalitaDiagnostica = !inModalitaDiagnostica;
        
        if (inModalitaDiagnostica) {
          schermoLcd.style.borderColor = "var(--primary)";
          document.getElementById("stato-contenitore").innerHTML = `
            <div style="text-align: left; width: 100%; padding: 10px; font-size: 0.82rem;">
              <p style="color: var(--primary); font-weight: bold; margin-bottom: 8px;"><i class="ti ti-cpu"></i> DIAGNOSTICA POKÉGEAR</p>
              <p style="color: var(--text-muted); margin-bottom: 4px;">• Firmware: v3.0-Stable</p>
              <p style="color: var(--text-muted); margin-bottom: 4px;">• Vetrina: Attiva e Sincronizzata</p>
              <p style="color: var(--text-muted); margin-bottom: 4px;">• Stato Sync: Online / Attivo</p>
              <p style="color: var(--success); margin-top: 12px; text-align: center;">Tocca di nuovo Power per tornare alla Home.</p>
            </div>
          `;
        } else {
          schermoLcd.style.borderColor = "var(--screen-border)";
          caricaInterfaccia(configData);
        }
      });

      btnPokeball.addEventListener("click", () => {
        const frasi = [
          "«Un buon Professore ascolta sempre i suoi giocatori.»",
          "«Controlla sempre il mazzo prima dell'inizio del round!»",
          "«Le regole sono importanti, ma il fair play viene prima di tutto.»",
          "«Pronta per un nuovo torneo Play! Pokémon?»"
        ];
        const fraseCasuale = frasi[Math.floor(Math.random() * frasi.length)];
        
        const contenitore = document.getElementById("stato-contenitore");
        contenitore.innerHTML = `
          <div style="padding: 20px; text-align: center;">
            <i class="ti ti-pokeball" style="font-size: 36px; color: var(--primary); margin-bottom: 12px; display: inline-block;"></i>
            <p style="font-size: 0.95rem; font-style: italic; color: var(--accent-silver); line-height: 1.4;">${fraseCasuale}</p>
          </div>
        `;

        setTimeout(() => {
          if (!inModalitaDiagnostica && configData) {
            caricaInterfaccia(configData);
          }
        }, 3500);
      });
    });
  </script>
</body>
</html>
