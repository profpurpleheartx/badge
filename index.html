<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0d14" />
  <meta name="description" content="Pokégear Luxury // Professor Edition — Professoressa Stefi" />

  <title>Pokégear Luxury // Professor Edition</title>

  <meta property="og:title" content="Pokégear Luxury // Professoressa Stefi" />
  <meta property="og:description" content="Professor Edition — Play! Pokémon Professor" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://profpurpleheartx.github.io/badge/preview-card.png" />
  <meta property="og:url" content="https://profpurpleheartx.github.io/badge/" />

  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css" />

  <style>
    :root {
      --bg: #080a10;
      --bg-2: #0e1119;
      --shell: #171a24;
      --shell-2: #202431;
      --screen: #0d1018;
      --screen-2: #11151f;
      --line: rgba(255,255,255,.10);
      --line-strong: rgba(180,169,255,.34);
      --text: #f5f6fb;
      --muted: #8e97ad;
      --soft: #c8ccda;
      --violet: #a99cff;
      --violet-2: #7568dc;
      --gold: #e3c67a;
      --cyan: #65d9ef;
      --green: #56d8aa;
      --red: #ff6f83;
      --shadow: 0 36px 90px rgba(0,0,0,.55);
      --radius: 34px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { min-height: 100%; background: var(--bg); }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 14px;
      overflow-x: hidden;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 8%, rgba(169,156,255,.12), transparent 28%),
        radial-gradient(circle at 82% 84%, rgba(101,217,239,.07), transparent 28%),
        linear-gradient(145deg, #080a10 0%, #0f121b 55%, #090b11 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .14;
      background:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: linear-gradient(to bottom, #000, transparent 88%);
    }

    .shell {
      position: relative;
      width: min(100%, 480px);
      padding: 18px;
      border-radius: var(--radius);
      background:
        linear-gradient(145deg, rgba(255,255,255,.07), transparent 25%),
        linear-gradient(160deg, #222633 0%, #171a24 62%, #11141c 100%);
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.08);
    }

    .shell::before {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: calc(var(--radius) - 1px);
      border: 1px solid rgba(169,156,255,.06);
      pointer-events: none;
    }

    .hardware-screw {
      position: absolute;
      width: 8px;
      height: 8px;
      z-index: 5;
      border-radius: 50%;
      background: #2f3443;
      border: 1px solid #10131b;
      box-shadow: inset 0 1px 2px rgba(0,0,0,.75), 0 1px 0 rgba(255,255,255,.04);
    }
    .hardware-screw::after {
      content: "";
      position: absolute;
      left: 2px;
      right: 2px;
      top: 3px;
      height: 1px;
      background: #687087;
      transform: rotate(45deg);
    }
    .s1 { top: 11px; left: 12px; }
    .s2 { top: 11px; right: 12px; }
    .s3 { bottom: 11px; left: 12px; }
    .s4 { bottom: 11px; right: 12px; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 2px 4px 14px;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(169,156,255,.30);
      border-radius: 9px;
      color: var(--violet);
      background: rgba(169,156,255,.08);
      box-shadow: 0 0 18px rgba(169,156,255,.08);
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-name {
      color: #e9ecf6;
      font-size: .68rem;
      font-weight: 900;
      letter-spacing: 1.65px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .brand-sub {
      margin-top: 2px;
      color: #6f778a;
      font-size: .55rem;
      font-weight: 700;
      letter-spacing: 1.35px;
      text-transform: uppercase;
    }

    .top-status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font: 700 .62rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px rgba(86,216,170,.75);
    }

    .status-dot.offline {
      background: var(--red);
      box-shadow: 0 0 12px rgba(255,111,131,.7);
    }

    .screen {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 25px;
      background:
        radial-gradient(circle at 50% 0%, rgba(169,156,255,.08), transparent 34%),
        linear-gradient(180deg, var(--screen-2), var(--screen));
      box-shadow: inset 0 2px 4px rgba(0,0,0,.4), inset 0 0 50px rgba(0,0,0,.13);
      transition: border-color .25s ease, box-shadow .25s ease;
    }

    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(transparent 50%, rgba(255,255,255,.015) 50%);
      background-size: 100% 6px;
      opacity: .34;
      z-index: 0;
    }

    .screen::after {
      content: "";
      position: absolute;
      width: 160px;
      height: 160px;
      top: -82px;
      right: -72px;
      border-radius: 50%;
      border: 1px solid rgba(169,156,255,.08);
      box-shadow:
        0 0 0 18px rgba(169,156,255,.025),
        0 0 0 36px rgba(169,156,255,.015);
      pointer-events: none;
    }

    #stato-contenitore {
      position: relative;
      z-index: 1;
      min-height: 540px;
    }

    .profile {
      min-height: 540px;
      padding: 21px 20px 18px;
      display: flex;
      flex-direction: column;
    }

    .eyebrow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      color: #6f778a;
      font-size: .56rem;
      font-weight: 800;
      letter-spacing: 1.45px;
      text-transform: uppercase;
    }

    .eyebrow-badge {
      color: var(--gold);
    }

    .portrait-wrap {
      position: relative;
      width: 112px;
      height: 112px;
      margin: 20px auto 14px;
    }

    .portrait-wrap::before,
    .portrait-wrap::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      inset: 5px;
      border: 1px solid rgba(169,156,255,.25);
    }

    .portrait-wrap::after {
      inset: -4px;
      border: 1px solid rgba(227,198,122,.11);
    }

    .portrait {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 50%;
      border: 2px solid rgba(169,156,255,.88);
      background:
        radial-gradient(circle at 32% 25%, rgba(255,255,255,.12), transparent 31%),
        linear-gradient(145deg, #24293a, #151925);
      color: var(--violet);
      font-size: 42px;
      box-shadow:
        0 0 0 6px rgba(169,156,255,.045),
        0 15px 34px rgba(0,0,0,.35),
        0 0 30px rgba(169,156,255,.09);
    }

    .portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .identity {
      text-align: center;
    }

    .identity h1 {
      color: #f9faff;
      font-size: clamp(1.5rem, 6vw, 1.8rem);
      line-height: 1.08;
      font-weight: 850;
      letter-spacing: -.6px;
    }

    .role {
      margin-top: 6px;
      color: var(--violet);
      font-size: .68rem;
      font-weight: 850;
      letter-spacing: 1.55px;
      text-transform: uppercase;
    }

    .identity-divider {
      width: 54px;
      height: 1px;
      margin: 12px auto 11px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: .7;
    }

    .meta {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 7px;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 999px;
      background: rgba(255,255,255,.025);
      color: var(--muted);
      font-size: .64rem;
    }

    .meta-pill strong {
      color: #e8ebf4;
      font-weight: 800;
    }

    .credentials {
      margin-top: 23px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #dfe3ef;
      font-size: .64rem;
      font-weight: 850;
      letter-spacing: 1.25px;
      text-transform: uppercase;
    }

    .section-title i {
      color: var(--gold);
      font-size: 15px;
    }

    .section-caption {
      color: #626a7d;
      font: 700 .56rem/1 ui-monospace, monospace;
      letter-spacing: .8px;
    }

    .credential-list {
      display: grid;
      gap: 8px;
      max-height: 162px;
      overflow-y: auto;
      padding-right: 3px;
      scrollbar-width: thin;
      scrollbar-color: #394054 transparent;
    }

    .credential-list::-webkit-scrollbar { width: 4px; }
    .credential-list::-webkit-scrollbar-thumb {
      background: #394054;
      border-radius: 999px;
    }

    .credential {
      position: relative;
      display: grid;
      grid-template-columns: 40px minmax(0,1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border: 1px solid rgba(255,255,255,.075);
      border-radius: 14px;
      background:
        linear-gradient(110deg, rgba(255,255,255,.045), rgba(255,255,255,.018));
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }

    .credential:hover {
      transform: translateY(-1px);
      border-color: rgba(169,156,255,.34);
      background: linear-gradient(110deg, rgba(169,156,255,.09), rgba(255,255,255,.018));
    }

    .credential-icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      color: var(--violet);
      background: rgba(169,156,255,.08);
      border: 1px solid rgba(169,156,255,.12);
      font-size: 18px;
    }

    .credential-copy {
      min-width: 0;
    }

    .credential-name {
      display: block;
      overflow: hidden;
      color: #f0f2f8;
      font-size: .76rem;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .credential-type {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: .59rem;
      font-weight: 650;
      letter-spacing: .6px;
      text-transform: uppercase;
    }

    .credential-mark {
      color: var(--gold);
      font-size: .62rem;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .social-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 15px;
    }

    .social {
      width: 35px;
      height: 35px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #abb2c4;
      border: 1px solid rgba(255,255,255,.09);
      background: rgba(255,255,255,.02);
      text-decoration: none;
      transition: all .2s ease;
    }

    .social:hover {
      color: #fff;
      border-color: rgba(169,156,255,.4);
      background: rgba(169,156,255,.09);
      transform: translateY(-2px);
    }

    .footer-strip {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding: 11px 3px 0;
      border-top: 1px solid rgba(255,255,255,.07);
    }

    .foot-stat {
      color: #656d80;
      font: 700 .56rem/1.2 ui-monospace, monospace;
      letter-spacing: .55px;
    }

    .foot-stat:last-child { text-align: right; }

    .seal {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--gold);
      border: 1px solid rgba(227,198,122,.18);
      background:
        radial-gradient(circle, rgba(227,198,122,.09), transparent 65%),
        rgba(255,255,255,.015);
      font-size: 17px;
    }

    .control-zone {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 14px;
      padding: 0 2px 1px;
    }

    .control {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid #3b4255;
      border-radius: 50%;
      background: #10131b;
      color: #aeb5c7;
      cursor: pointer;
      transition: all .16s ease;
    }

    .control:hover {
      color: var(--violet);
      border-color: rgba(169,156,255,.50);
      box-shadow: 0 0 18px rgba(169,156,255,.13);
    }

    .control:active { transform: scale(.9); }

    .console-label {
      color: #6d7486;
      font-size: .58rem;
      font-weight: 850;
      letter-spacing: 1.7px;
      text-transform: uppercase;
    }

    .diagnostic,
    .secret,
    .offline {
      min-height: 540px;
      padding: 25px 21px;
      display: grid;
      align-content: center;
    }

    .diag-kicker {
      color: var(--gold);
      font-size: .58rem;
      font-weight: 850;
      letter-spacing: 1.45px;
      text-transform: uppercase;
    }

    .diag-title {
      margin-top: 7px;
      color: #f5f7fc;
      font-size: 1.35rem;
      font-weight: 850;
    }

    .diag-grid {
      display: grid;
      gap: 7px;
      margin-top: 23px;
    }

    .diag-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px solid rgba(255,255,255,.07);
      color: var(--muted);
      font-size: .74rem;
    }

    .diag-row strong {
      color: #e4e7f0;
      font-weight: 800;
      text-align: right;
    }

    .diag-ok {
      margin-top: 19px;
      color: var(--green);
      font-size: .7rem;
      line-height: 1.5;
    }

    .diag-hint {
      margin-top: 22px;
      color: #677084;
      font: 700 .6rem/1.45 ui-monospace, monospace;
      text-align: center;
    }

    .secret {
      text-align: center;
    }

    .secret-medal {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--gold);
      border: 1px solid rgba(227,198,122,.24);
      background: radial-gradient(circle, rgba(227,198,122,.13), rgba(227,198,122,.02) 68%, transparent 70%);
      box-shadow: 0 0 28px rgba(227,198,122,.06);
      font-size: 26px;
    }

    .secret-kicker {
      color: #70778a;
      font-size: .58rem;
      font-weight: 850;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .secret p {
      max-width: 290px;
      margin: 12px auto 0;
      color: #e2e5ee;
      font-size: .92rem;
      font-style: italic;
      line-height: 1.6;
    }

    .offline {
      text-align: center;
    }

    .offline-icon {
      color: #727a8d;
      font-size: 46px;
      margin-bottom: 13px;
    }

    .offline h1 {
      font-size: 1.5rem;
    }

    .offline p {
      max-width: 295px;
      margin: 9px auto 0;
      color: var(--muted);
      font-size: .8rem;
      line-height: 1.6;
    }

    .boot-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at center, rgba(169,156,255,.09), transparent 30%),
        #080a10;
      transition: opacity .45s ease, visibility .45s ease;
    }

    .boot-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .boot-card {
      width: min(86vw, 320px);
      text-align: center;
      color: #d6d9e5;
    }

    .boot-logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border-radius: 17px;
      border: 1px solid rgba(169,156,255,.28);
      background: rgba(169,156,255,.06);
      color: var(--violet);
      font-size: 24px;
      box-shadow: 0 0 28px rgba(169,156,255,.08);
      animation: pulse 1.7s ease-in-out infinite;
    }

    .boot-title {
      font-size: .77rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .boot-sub {
      margin-top: 5px;
      color: #747c90;
      font-size: .59rem;
      letter-spacing: 1.25px;
      text-transform: uppercase;
    }

    .boot-line {
      width: 100%;
      height: 2px;
      margin-top: 18px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,.07);
    }

    .boot-line::after {
      content: "";
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, var(--violet), transparent);
      animation: load 1.35s ease-in-out infinite;
    }

    @keyframes pulse {
      50% { transform: translateY(-2px) scale(1.02); box-shadow: 0 0 32px rgba(169,156,255,.15); }
    }

    @keyframes load {
      from { transform: translateX(-130%); }
      to { transform: translateX(320%); }
    }

    @media (max-width: 430px) {
      body { padding: 10px; }
      .shell { padding: 14px; border-radius: 28px; }
      .profile, .diagnostic, .secret, .offline { min-height: 510px; }
      #stato-contenitore { min-height: 510px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="boot-overlay" id="boot-overlay" aria-hidden="true">
    <div class="boot-card">
      <div class="boot-logo"><i class="ti ti-device-mobile"></i></div>
      <div class="boot-title">Pokégear Luxury</div>
      <div class="boot-sub">Professor Edition // Initializing</div>
      <div class="boot-line"></div>
    </div>
  </div>

  <main class="shell" aria-label="Pokégear Luxury della Professoressa Stefi">
    <span class="hardware-screw s1" aria-hidden="true"></span>
    <span class="hardware-screw s2" aria-hidden="true"></span>
    <span class="hardware-screw s3" aria-hidden="true"></span>
    <span class="hardware-screw s4" aria-hidden="true"></span>

    <header class="topbar">
      <div class="brand-lockup">
        <div class="brand-mark"><i class="ti ti-device-mobile"></i></div>
        <div class="brand-copy">
          <div class="brand-name">Pokégear Luxury</div>
          <div class="brand-sub">Professor Edition // League Console</div>
        </div>
      </div>

      <div class="top-status">
        <span id="pokegear-clock">00:00</span>
        <i class="ti ti-battery-4" aria-label="Batteria"></i>
        <span class="status-dot" id="indicatore-stato" aria-label="Stato online"></span>
      </div>
    </header>

    <section class="screen" id="schermo-lcd" aria-live="polite">
      <div id="stato-contenitore"></div>
    </section>

    <div class="control-zone">
      <button class="control" id="btn-power" type="button" aria-label="Apri diagnostica" title="Diagnostica">
        <i class="ti ti-power"></i>
      </button>

      <span class="console-label">League Console</span>

      <button class="control" id="btn-pokeball" type="button" aria-label="Mostra messaggio del Professor" title="Messaggio del Professor">
        <i class="ti ti-ball-pokeball"></i>
      </button>
    </div>
  </main>

  <script>
    let configData = null;
    let inModalitaDiagnostica = false;
    let secretTimer = null;

    function aggiornaOrologio() {
      const now = new Date();
      const el = document.getElementById("pokegear-clock");
      if (!el) return;
      el.textContent = now.toLocaleTimeString("it-IT", {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function iconClass(icon) {
      return typeof icon === "string" && /^ti(?:-[a-z0-9]+)*$/.test(icon)
        ? icon
        : "ti ti-award";
    }

    function setStatus(isOnline) {
      const dot = document.getElementById("indicatore-stato");
      if (!dot) return;
      dot.classList.toggle("offline", !isOnline);
      dot.setAttribute("aria-label", isOnline ? "Stato online" : "Stato offline");
    }

    function setScreenAccent(kind = "default") {
      const screen = document.getElementById("schermo-lcd");
      if (!screen) return;

      const colors = {
        default: "rgba(255,255,255,.09)",
        violet: "rgba(169,156,255,.48)",
        gold: "rgba(227,198,122,.36)"
      };

      screen.style.borderColor = colors[kind] || colors.default;
    }

    function caricaInterfaccia(config) {
      const root = document.getElementById("stato-contenitore");

      root.innerHTML = `
        <div class="profile">
          <div class="eyebrow">
            <span>Professor Profile // Digital Credential</span>
            <span class="eyebrow-badge"><i class="ti ti-certificate"></i> Certified</span>
          </div>

          <div class="portrait-wrap">
            <div class="portrait" id="profilo-avatar">
              <i class="ti ti-shield-check"></i>
            </div>
          </div>

          <div class="identity">
            <h1 id="profilo-nome"></h1>
            <div class="role" id="profilo-ruolo"></div>
            <div class="identity-divider"></div>

            <div class="meta">
              <span class="meta-pill"><i class="ti ti-id"></i> Player ID <strong id="profilo-pid"></strong></span>
              <span class="meta-pill"><i class="ti ti-map-pin"></i> <strong id="profilo-regione"></strong></span>
            </div>
          </div>

          <section class="credentials">
            <div class="section-head">
              <div class="section-title">
                <i class="ti ti-badge"></i>
                Credentials
              </div>
              <div class="section-caption">VERIFIED PROFILE</div>
            </div>

            <div class="credential-list" id="profilo-vetrina"></div>
          </section>

          <div class="social-row" id="profilo-socials"></div>

          <div class="footer-strip">
            <div class="foot-stat">LEAGUE STATUS<br><strong style="color:var(--green)">ACTIVE</strong></div>
            <div class="seal"><i class="ti ti-shield-star"></i></div>
            <div class="foot-stat">EDITION<br><strong style="color:#d7dbe6">PROFESSOR</strong></div>
          </div>
        </div>
      `;

      document.getElementById("profilo-nome").textContent = config.nome || "Professoressa Stefi";
      document.getElementById("profilo-pid").textContent = config.playerId || "—";
      document.getElementById("profilo-regione").textContent = config.regione || "—";
      document.getElementById("profilo-ruolo").textContent = config.ruolo || "";

      const avatar = document.getElementById("profilo-avatar");
      if (config.avatarUrl && config.avatarUrl.trim()) {
        const img = document.createElement("img");
        img.src = config.avatarUrl;
        img.alt = `Avatar ${config.nome || "profilo"}`;
        img.addEventListener("error", () => {
          avatar.innerHTML = '<i class="ti ti-shield-check"></i>';
        }, { once: true });
        avatar.replaceChildren(img);
      }

      const credentials = document.getElementById("profilo-vetrina");
      const certificazioni = Array.isArray(config.certificazioni) ? config.certificazioni : [];

      if (!certificazioni.length) {
        credentials.innerHTML = `
          <div class="credential">
            <div class="credential-icon"><i class="ti ti-info-circle"></i></div>
            <div class="credential-copy">
              <span class="credential-name">Nessuna certificazione</span>
              <span class="credential-type">Profilo in aggiornamento</span>
            </div>
          </div>`;
      } else {
        certificazioni.forEach(cert => {
          const item = document.createElement("article");
          item.className = "credential";

          const icon = document.createElement("div");
          icon.className = "credential-icon";
          icon.innerHTML = `<i class="${iconClass(cert.icon)}"></i>`;

          const copy = document.createElement("div");
          copy.className = "credential-copy";

          const name = document.createElement("span");
          name.className = "credential-name";
          name.textContent = cert.titolo || "Certificazione";

          const type = document.createElement("span");
          type.className = "credential-type";
          type.textContent = cert.categoria || "";

          const mark = document.createElement("span");
          mark.className = "credential-mark";
          mark.textContent = "Verified";

          copy.append(name, type);
          item.append(icon, copy, mark);
          credentials.appendChild(item);
        });
      }

      const socials = document.getElementById("profilo-socials");
      const socialData = Array.isArray(config.socials) ? config.socials : [];

      socialData.forEach(social => {
        if (!social || !social.url || social.url === "#") return;

        const link = document.createElement("a");
        link.className = "social";
        link.href = social.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.setAttribute("aria-label", social.platform || "Social");

        const icon = document.createElement("i");
        icon.className = `ti ti-${social.platform || "link"}`;

        link.appendChild(icon);
        socials.appendChild(link);
      });
    }

    function mostraOffline() {
      setStatus(false);

      document.getElementById("stato-contenitore").innerHTML = `
        <div class="offline">
          <div>
            <i class="ti ti-eye-off offline-icon"></i>
            <h1>Modalità Sospesa</h1>
            <p>Il Pokégear è temporaneamente offline. Torna a trovarci durante i prossimi eventi ufficiali!</p>
          </div>
        </div>
      `;
    }

    function mostraDiagnostica() {
      setScreenAccent("violet");

      document.getElementById("stato-contenitore").innerHTML = `
        <div class="diagnostic">
          <div>
            <div class="diag-kicker">System Diagnostics</div>
            <h2 class="diag-title">Pokégear Check</h2>

            <div class="diag-grid">
              <div class="diag-row"><span>Firmware</span><strong>v3.0-Stable</strong></div>
              <div class="diag-row"><span>Credential Sync</span><strong>Online / Active</strong></div>
              <div class="diag-row"><span>Professor Profile</span><strong>Verified</strong></div>
              <div class="diag-row"><span>League Console</span><strong>Ready</strong></div>
            </div>

            <div class="diag-ok">
              <i class="ti ti-circle-check"></i>
              Tutti i sistemi principali risultano pronti.
            </div>

            <div class="diag-hint">Premi nuovamente Power per tornare al profilo.</div>
          </div>
        </div>
      `;
    }

    function mostraSegreto() {
      clearTimeout(secretTimer);
      setScreenAccent("gold");

      const frasi = [
        "«Un buon Professore ascolta sempre i suoi giocatori.»",
        "«Controlla sempre il mazzo prima dell'inizio del round!»",
        "«Le regole sono importanti, ma il fair play viene prima di tutto.»",
        "«Pronta per un nuovo torneo Play! Pokémon?»"
      ];

      const frase = frasi[Math.floor(Math.random() * frasi.length)];
      const root = document.getElementById("stato-contenitore");

      const wrap = document.createElement("div");
      wrap.className = "secret";

      const inner = document.createElement("div");
      const medal = document.createElement("div");
      medal.className = "secret-medal";
      medal.innerHTML = '<i class="ti ti-ball-pokeball"></i>';

      const kicker = document.createElement("div");
      kicker.className = "secret-kicker";
      kicker.textContent = "Professor Message";

      const quote = document.createElement("p");
      quote.textContent = frase;

      inner.append(medal, kicker, quote);
      wrap.appendChild(inner);
      root.replaceChildren(wrap);

      secretTimer = setTimeout(() => {
        if (configData && !inModalitaDiagnostica) {
          setScreenAccent("default");
          caricaInterfaccia(configData);
        }
      }, 3500);
    }

    async function init() {
      aggiornaOrologio();
      setInterval(aggiornaOrologio, 1000);

      const boot = document.getElementById("boot-overlay");

      try {
        const response = await fetch("config.json", { cache: "no-store" });
        if (!response.ok) throw new Error("Configurazione non disponibile");

        configData = await response.json();

        if (configData.disattivato) {
          mostraOffline();
        } else {
          setStatus(true);
          caricaInterfaccia(configData);
        }
      } catch (error) {
        console.error(error);
        setStatus(false);
        document.getElementById("stato-contenitore").innerHTML = `
          <div class="offline">
            <div>
              <i class="ti ti-alert-circle offline-icon"></i>
              <h1>Errore di caricamento</h1>
              <p>Impossibile leggere la configurazione del Pokégear.</p>
            </div>
          </div>
        `;
      } finally {
        window.setTimeout(() => boot.classList.add("hidden"), 500);
      }

      document.getElementById("btn-power").addEventListener("click", () => {
        if (!configData || configData.disattivato) return;

        inModalitaDiagnostica = !inModalitaDiagnostica;
        clearTimeout(secretTimer);

        if (inModalitaDiagnostica) {
          mostraDiagnostica();
        } else {
          setScreenAccent("default");
          caricaInterfaccia(configData);
        }
      });

      document.getElementById("btn-pokeball").addEventListener("click", () => {
        if (!configData || configData.disattivato) return;

        inModalitaDiagnostica = false;
        mostraSegreto();
      });
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
