<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Professor Hub — Pastel</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components/hero.css">
  <link rel="stylesheet" href="css/components/info-cards.css">
  <link rel="stylesheet" href="css/components/certifications.css">
  <link rel="stylesheet" href="css/components/modal.css">
  <link rel="stylesheet" href="css/components/toast.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/dark-mode.css">
</head>
<body>
<main class="page-shell">
  <section id="hero" class="hero"></section>
  <section id="info" class="section"></section>
  <section id="certifications" class="section">
    <div class="section-heading">
      <span class="eyebrow">Formazione</span>
      <h2>Certificazioni</h2>
      <p>Le certificazioni e le specializzazioni del profilo.</p>
    </div>
    <div id="certification-grid" class="certification-grid"></div>
  </section>
  <section class="social-cta">
    <a id="instagram-link" class="instagram-button" target="_blank" rel="noopener">Instagram</a>
  </section>
</main>

<div id="modal" class="modal" aria-hidden="true">
  <div class="modal-backdrop" data-modal-close></div>
  <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="modal-close" type="button" data-modal-close aria-label="Chiudi">×</button>
    <h3 id="modal-title"></h3>
    <p id="modal-description"></p>
    <div id="modal-gallery" class="modal-gallery"></div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
