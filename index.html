<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#11131d" />

  <title>Pokégear // Professor Profile</title>

  <meta property="og:title" content="Pokégear // Professoressa Stefi" />
  <meta property="og:description" content="Tesserino digitale e certificazioni Play! Pokémon." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://profpurpleheartx.github.io/badge/preview-card.png" />
  <meta property="og:url" content="https://profpurpleheartx.github.io/badge/" />

  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css" />

  <style>
    :root {
      --bg: #0b0d14;
      --panel: #151824;
      --panel-2: #1b1f2e;
      --screen: #10131d;
      --line: #30364b;
      --line-soft: rgba(255,255,255,.08);
      --text: #f6f7fb;
      --muted: #9da5ba;
      --purple: #9b8cff;
      --purple-2: #7566e8;
      --cyan: #54d9ff;
      --yellow: #ffd75e;
      --green: #45e0a4;
      --red: #ff667d;
      --shadow: 0 28px 70px rgba(0,0,0,.48);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 15%, rgba(155,140,255,.12), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(84,217,255,.08), transparent 28%),
        linear-gradient(145deg, #0b0d14 0%, #10121b 55%, #0a0c12 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .18;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    .pokegear {
      position: relative;
      width: min(100%, 460px);
      padding: 20px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 30px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.07), transparent 24%),
        linear-gradient(145deg, #202332, #151824 65%, #10121a);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.08);
      overflow: hidden;
    }

    .pokegear::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 29px;
      pointer-events: none;
      border: 1px solid rgba(155,140,255,.07);
    }

    .screw {
      position: absolute;
      z-index: 3;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #303545;
      border: 1px solid #11131b;
      box-shadow: inset 0 1px 2px rgba(0,0,0,.8);
    }
    .screw::after {
      content: "";
      position: absolute;
      left: 2px;
      right: 2px;
      top: 3px;
      height: 1px;
      background: #5b6277;
      transform: rotate(45deg);
    }
    .screw-tl { top: 11px; left: 11px; }
    .screw-tr { top: 11px; right: 11px; }
    .screw-bl { bottom: 11px; left: 11px; }
    .screw-br { bottom: 11px; right: 11px; }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 2px 5px 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #dfe3f1;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: 1.8px;
    }

    .brand i {
      color: var(--purple);
      font-size: 17px;
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font: 600 .68rem/1 monospace;
    }

    .battery {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px rgba(69,224,164,.8);
    }

    .screen {
      position: relative;
      min-height: 500px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background:
        radial-gradient(circle at 50% 0%, rgba(155,140,255,.08), transparent 38%),
        linear-gradient(180deg, #11141e, #0d1018);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.035), inset 0 12px 30px rgba(0,0,0,.16);
      overflow: hidden;
    }

    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(transparent 50%, rgba(255,255,255,.012) 50%);
      background-size: 100% 5px;
      opacity: .35;
    }

    .profile {
      position: relative;
      z-index: 1;
      min-height: 458px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .profile-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: .64rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .online-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--green);
      font-weight: 700;
    }

    .avatar {
      position: relative;
      width: 96px;
      height: 96px;
      margin: 2px auto 13px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 2px solid rgba(155,140,255,.9);
      background:
        radial-gradient(circle at 35% 25%, rgba(255,255,255,.12), transparent 30%),
        #191d2a;
      color: var(--purple);
      font-size: 38px;
      box-shadow:
        0 0 0 5px rgba(155,140,255,.07),
        0 12px 35px rgba(0,0,0,.3),
        0 0 28px rgba(155,140,255,.12);
      overflow: hidden;
    }

    .avatar::after {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: inherit;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      font-size: clamp(1.35rem, 5vw, 1.6rem);
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -.4px;
      text-align: center;
    }

    .role {
      margin-top: 5px;
      color: var(--purple);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .identity {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px;
      margin: 13px 0 20px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255,255,255,.025);
      font-size: .67rem;
    }

    .pill strong {
      color: #e9ebf5;
      font-weight: 750;
    }

    .section {
      width: 100%;
      margin-top: auto;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 7px;
      padding-bottom: 7px;
      border-bottom: 1px solid var(--line-soft);
      color: var(--muted);
      font-size: .66rem;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .section-title i {
      color: var(--yellow);
      font-size: 15px;
    }

    .cert-grid {
      display: grid;
      gap: 8px;
      margin-top: 9px;
      max-height: 174px;
      overflow-y: auto;
      padding-right: 3px;
      scrollbar-width: thin;
      scrollbar-color: #3a4055 transparent;
    }

    .cert-grid::-webkit-scrollbar { width: 4px; }
    .cert-grid::-webkit-scrollbar-thumb {
      background: #3a4055;
      border-radius: 999px;
    }

    .cert {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--line-soft);
      border-radius: 13px;
      background: linear-gradient(100deg, rgba(255,255,255,.045), rgba(255,255,255,.018));
      transition: .2s ease;
    }

    .cert:hover {
      transform: translateY(-1px);
      border-color: rgba(155,140,255,.45);
      background: rgba(155,140,255,.07);
    }

    .cert-icon {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: var(--purple);
      background: rgba(155,140,255,.11);
      border: 1px solid rgba(155,140,255,.15);
      font-size: 17px;
    }

    .cert-info {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .cert-name {
      overflow: hidden;
      color: #f0f1f7;
      font-size: .76rem;
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cert-type {
      color: var(--muted);
      font-size: .62rem;
      letter-spacing: .55px;
      text-transform: uppercase;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 9px;
      margin-top: 14px;
    }

    .social {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: #b9bfd1;
      background: rgba(255,255,255,.025);
      text-decoration: none;
      transition: .2s ease;
    }

    .social:hover {
      color: #fff;
      border-color: rgba(155,140,255,.55);
      background: rgba(155,140,255,.12);
      transform: translateY(-2px);
    }

    .offline {
      min-height: 458px;
      display: grid;
      place-items: center;
      text-align: center;
    }

    .offline-icon {
      font-size: 48px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .offline p {
      max-width: 300px;
      margin-top: 8px;
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.55;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      padding: 13px 5px 2px;
      border-top: 1px solid rgba(255,255,255,.08);
    }

    .control {
      width: 39px;
      height: 39px;
      display: grid;
      place-items: center;
      border: 1px solid #3a4054;
      border-radius: 50%;
      color: #aab1c4;
      background: #11131c;
      cursor: pointer;
      transition: .16s ease;
    }

    .control:hover {
      color: var(--purple);
      border-color: rgba(155,140,255,.65);
      box-shadow: 0 0 16px rgba(155,140,255,.16);
    }

    .control:active {
      transform: scale(.9);
    }

    .footer-label {
      color: #737b90;
      font-size: .6rem;
      font-weight: 800;
      letter-spacing: 1.8px;
    }

    .diagnostic {
      position: relative;
      z-index: 1;
      min-height: 458px;
      padding: 15px 5px;
    }

    .diagnostic-title {
      color: var(--purple);
      font-size: .8rem;
      font-weight: 850;
      letter-spacing: 1px;
      margin-bottom: 18px;
    }

    .diagnostic-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px solid var(--line-soft);
      color: var(--muted);
      font-size: .76rem;
    }

    .diagnostic-row strong {
      color: #e8eaf2;
      font-weight: 700;
    }

    .diagnostic-hint {
      margin-top: 22px;
      color: var(--green);
      text-align: center;
      font-size: .72rem;
      line-height: 1.45;
    }

    .secret {
      min-height: 458px;
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 25px;
    }

    .secret i {
      display: block;
      margin-bottom: 14px;
      color: var(--yellow);
      font-size: 42px;
    }

    .secret p {
      color: #dfe2ed;
      font-size: .9rem;
      font-style: italic;
      line-height: 1.55;
    }

    @media (max-width: 420px) {
      body { padding: 12px; }
      .pokegear { padding: 14px; border-radius: 25px; }
      .screen { padding: 15px; min-height: 480px; }
      .profile { min-height: 438px; }
      .offline, .diagnostic, .secret { min-height: 438px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="pokegear" aria-label="Pokégear della Professoressa Stefi">
    <span class="screw screw-tl" aria-hidden="true"></span>
    <span class="screw screw-tr" aria-hidden="true"></span>
    <span class="screw screw-bl" aria-hidden="true"></span>
    <span class="screw screw-br" aria-hidden="true"></span>

    <header class="header">
      <div class="brand">
        <i class="ti ti-device-mobile"></i>
        <span>POKÉGEAR // v3.0</span>
      </div>

      <div class="header-status">
        <span id="pokegear-clock">00:00</span>
        <span class="battery" title="Batteria: 100%">
          <i class="ti ti-battery-4"></i>
        </span>
        <span class="status-dot" id="indicatore-stato" aria-label="Stato online"></span>
      </div>
    </header>

    <section class="screen" id="schermo-lcd" aria-live="polite">
      <div id="stato-contenitore"></div>
    </section>

    <footer class="footer">
      <button class="control" id="btn-power" type="button" title="Diagnostica Sistema" aria-label="Apri diagnostica">
        <i class="ti ti-power"></i>
      </button>

      <span class="footer-label">LEAGUE CONSOLE</span>

      <button class="control" id="btn-pokeball" type="button" title="Messaggio Segreto" aria-label="Mostra messaggio segreto">
        <i class="ti ti-ball-pokeball"></i>
      </button>
    </footer>
  </main>

  <script>
    let configData = null;
    let inModalitaDiagnostica = false;
    let secretTimer = null;

    function aggiornaOrologio() {
      const ora = new Date();
      const clockEl = document.getElementById("pokegear-clock");
      if (clockEl) {
        clockEl.textContent = ora.toLocaleTimeString("it-IT", {
          hour: "2-digit",
          minute: "2-digit"
        });
      }
    }

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = String(value ?? "");
      return div.innerHTML;
    }

    function iconaValida(icon) {
      return typeof icon === "string" && /^ti(?:-[a-z0-9]+)*$/.test(icon)
        ? icon
        : "ti ti-award";
    }

    function caricaInterfaccia(config) {
      const contenitore = document.getElementById("stato-contenitore");

      contenitore.innerHTML = `
        <div class="profile">
          <div class="profile-top">
            <span>Professor Profile</span>
            <span class="online-label">
              <span class="status-dot"></span> Online
            </span>
          </div>

          <div class="avatar" id="profilo-avatar" aria-label="Avatar profilo">
            <i class="ti ti-shield-check"></i>
          </div>

          <h1 id="profilo-nome"></h1>
          <p class="role" id="profilo-ruolo"></p>

          <div class="identity">
            <span class="pill"><i class="ti ti-id"></i> ID <strong id="profilo-pid"></strong></span>
            <span class="pill"><i class="ti ti-map-pin"></i> <strong id="profilo-regione"></strong></span>
          </div>

          <div class="section">
            <p class="section-title">
              <i class="ti ti-certificate"></i>
              Vetrina credenziali
            </p>
            <div class="cert-grid" id="profilo-vetrina"></div>
          </div>

          <div class="socials" id="profilo-socials" aria-label="Social"></div>
        </div>
      `;

      document.getElementById("profilo-nome").textContent = config.nome || "Professoressa Stefi";
      document.getElementById("profilo-pid").textContent = config.playerId || "—";
      document.getElementById("profilo-regione").textContent = config.regione || "—";
      document.getElementById("profilo-ruolo").textContent = config.ruolo || "";

      const avatarContainer = document.getElementById("profilo-avatar");
      if (config.avatarUrl && config.avatarUrl.trim()) {
        const img = document.createElement("img");
        img.src = config.avatarUrl;
        img.alt = `Avatar ${config.nome || "profilo"}`;
        img.addEventListener("error", () => {
          avatarContainer.innerHTML = '<i class="ti ti-shield-check"></i>';
        }, { once: true });
        avatarContainer.replaceChildren(img);
      }

      const certificazioni = Array.isArray(config.certificazioni) ? config.certificazioni : [];
      const vetrinaGrid = document.getElementById("profilo-vetrina");

      if (!certificazioni.length) {
        vetrinaGrid.innerHTML = '<div class="cert"><div class="cert-info"><span class="cert-name">Nessuna certificazione</span></div></div>';
      } else {
        certificazioni.forEach(cert => {
          const card = document.createElement("div");
          card.className = "cert";

          const iconBox = document.createElement("div");
          iconBox.className = "cert-icon";
          iconBox.innerHTML = `<i class="${iconaValida(cert.icon)}"></i>`;

          const info = document.createElement("div");
          info.className = "cert-info";

          const name = document.createElement("span");
          name.className = "cert-name";
          name.textContent = cert.titolo || "Certificazione";

          const type = document.createElement("span");
          type.className = "cert-type";
          type.textContent = cert.categoria || "";

          info.append(name, type);
          card.append(iconBox, info);
          vetrinaGrid.appendChild(card);
        });
      }

      const socialGrid = document.getElementById("profilo-socials");
      const socials = Array.isArray(config.socials) ? config.socials : [];

      socials.forEach(social => {
        if (!social || !social.url || social.url === "#") return;

        const a = document.createElement("a");
        a.className = "social";
        a.href = social.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.setAttribute("aria-label", social.platform || "Social");

        const icon = document.createElement("i");
        icon.className = `ti ti-${social.platform || "link"}`;

        a.appendChild(icon);
        socialGrid.appendChild(a);
      });
    }

    function mostraOffline() {
      document.getElementById("indicatore-stato").style.background = "var(--red)";
      document.getElementById("indicatore-stato").style.boxShadow = "0 0 12px rgba(255,102,125,.8)";

      document.getElementById("stato-contenitore").innerHTML = `
        <div class="offline">
          <div>
            <i class="ti ti-eye-off offline-icon"></i>
            <h1>Modalità Sospesa</h1>
            <p>Il Pokégear è temporaneamente offline. Torna a trovarci durante i prossimi eventi ufficiali!</p>
          </div>
        </div>
      `;
    }

    function mostraDiagnostica() {
      document.getElementById("schermo-lcd").style.borderColor = "rgba(155,140,255,.65)";
      document.getElementById("stato-contenitore").innerHTML = `
        <div class="diagnostic">
          <p class="diagnostic-title"><i class="ti ti-cpu"></i> DIAGNOSTICA POKÉGEAR</p>
          <div class="diagnostic-row"><span>Firmware</span><strong>v3.0-Stable</strong></div>
          <div class="diagnostic-row"><span>Vetrina</span><strong>Attiva e sincronizzata</strong></div>
          <div class="diagnostic-row"><span>Stato Sync</span><strong>Online / Attivo</strong></div>
          <p class="diagnostic-hint">Tocca di nuovo Power per tornare alla Home.</p>
        </div>
      `;
    }

    function mostraSegreto() {
      clearTimeout(secretTimer);

      document.getElementById("schermo-lcd").style.borderColor = "rgba(255,215,94,.45)";

      const frasi = [
        "«Un buon Professore ascolta sempre i suoi giocatori.»",
        "«Controlla sempre il mazzo prima dell'inizio del round!»",
        "«Le regole sono importanti, ma il fair play viene prima di tutto.»",
        "«Pronta per un nuovo torneo Play! Pokémon?»"
      ];

      const fraseCasuale = frasi[Math.floor(Math.random() * frasi.length)];

      document.getElementById("stato-contenitore").innerHTML = `
        <div class="secret">
          <div>
            <i class="ti ti-ball-pokeball"></i>
            <p>${escapeHtml(fraseCasuale)}</p>
          </div>
        </div>
      `;

      secretTimer = setTimeout(() => {
        if (configData && !inModalitaDiagnostica) {
          document.getElementById("schermo-lcd").style.borderColor = "var(--line)";
          caricaInterfaccia(configData);
        }
      }, 3500);
    }

    document.addEventListener("DOMContentLoaded", async () => {
      aggiornaOrologio();
      setInterval(aggiornaOrologio, 1000);

      try {
        const response = await fetch("config.json", { cache: "no-store" });
        if (!response.ok) throw new Error("Errore nel caricamento della configurazione");

        configData = await response.json();

        if (configData.disattivato) {
          mostraOffline();
          return;
        }

        caricaInterfaccia(configData);
      } catch (error) {
        console.error("Impossibile caricare il profilo:", error);
        document.getElementById("indicatore-stato").style.background = "var(--red)";
        document.getElementById("stato-contenitore").innerHTML = `
          <div class="offline">
            <div>
              <i class="ti ti-alert-circle offline-icon"></i>
              <h1>Errore di caricamento</h1>
              <p>Impossibile leggere il file di configurazione del Pokégear.</p>
            </div>
          </div>
        `;
      }

      document.getElementById("btn-power").addEventListener("click", () => {
        if (!configData || configData.disattivato) return;

        inModalitaDiagnostica = !inModalitaDiagnostica;

        if (inModalitaDiagnostica) {
          mostraDiagnostica();
        } else {
          document.getElementById("schermo-lcd").style.borderColor = "var(--line)";
          caricaInterfaccia(configData);
        }
      });

      document.getElementById("btn-pokeball").addEventListener("click", () => {
        if (!configData || configData.disattivato) return;
        inModalitaDiagnostica = false;
        mostraSegreto();
      });
    });
  </script>
</body>
</html>
